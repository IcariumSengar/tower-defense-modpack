#Realistic Airdrop (dyairdrop) config - real field names/defaults AND real
#section structure confirmed two ways: decompiling AirdropconfigConfiguration.
#class directly, then confirmed for real by inspecting the file this exact
#mod actually generated in a live sandbox boot (a flat, unsectioned first
#draft of this file was silently ignored by Forge's config loader - caught
#before shipping, not assumed correct from the decompile alone). Real
#sections are [worldevents]/[chestevents]/[Performance]/[debug]/[mapcompat] -
#only the fields this pack actually wants changed are set below; everything
#else stays at the mod's own shipped default (Forge configs tolerate a
#partial file, filling anything missing with defaults).
[worldevents]
	#enable=false: this pack drives every airdrop itself via wave_airdrop.js's
	#own wave%5===0 trigger (/setairdrop random @r ...). The mod's own built-in
	#"global airdrop event" (unconditionally on by default, fires automatically
	#every `gap` in-game days near a random player) is a second, autonomous
	#airdrop source this pack does not want layered on top of its own - same
	#"check for autonomous world-altering systems" caution already applied to
	#every other mob/mechanic mod in this pack. Disabling it here does not
	#affect the /setairdrop command path at all (confirmed via decompile - the
	#command handlers never read this flag).
	enable = false

[chestevents]
	#enableenemies=false: the mod's own default behavior spawns hostile mobs
	#(default list: pillager, zombie, husk) near an uncollected crate after
	#`enemyarrivetime` minutes. This pack already stripped every non-zombie-
	#family mob from its roster (2026-09-06 roster pivot - pillager would be a
	#regression), and any mob this spawns would be untracked by
	#wave_status.js's own hostile-remaining counter and un-targeted by
	#mob_aggro.js's pedestal-redirect - a second, uncoordinated mob-spawn
	#system on top of this pack's own carefully tuned wave/horde spawning.
	#The airdrop is a wave-clear reward, not a new threat generator.
	enableenemies = false

[Performance]
	#forceload=false: the mod author's own comment on this field (translated
	#from the shipped Chinese: "may damage already-loaded permanent chunks,
	#use cautiously on servers") is a real flagged risk this pack doesn't need
	#to take - every /setairdrop call here targets a position near a currently
	#online player (via `random @r` + a small drift), whose own chunks are
	#already loaded by normal player-tracking distance.
	forceload = false
