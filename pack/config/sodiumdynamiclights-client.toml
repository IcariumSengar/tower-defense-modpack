
#Performance pass 2026-09-26: mode REALTIME -> FAST. Decompiled
#DynamicLightsMode: REALTIME has a 0 ms delay (re-lights and queues chunk
#section rebuilds every frame a light source moves), FAST batches that to
#every 250 ms - held torches still glow, the light just trails by a beat.
[sodiumdynamiclights]
	#Lighting mode
	#Allowed Values: OFF, SLOW, FAST, REALTIME
	mode = "FAST"
	#Enable entities light source.
	entities = false
	#Enable first-person player light source.
	self = true
	#Enable block entities light source.
	block_entities = true
	#Enables water-sensitive light sources check. This means that water-sensitive items will not light up when submerged in water.
	water_sensitive_check = true
	#TNT lighting mode. May be off, simple or fancy.
	#Allowed Values: OFF, SIMPLE, FANCY
	tnt = "SIMPLE"
	#Creeper lighting mode. May be off, simple or fancy.
	#Allowed Values: OFF, SIMPLE, FANCY
	creeper = "OFF"
