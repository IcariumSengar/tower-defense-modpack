# This is the configuration file for Radium.
# This file exists for debugging purposes and should not be configured otherwise.
#
# You can find information on editing this file and all the available options here:
# https://github.com/jellysquid3/lithium-fabric/wiki/Configuration-File
#
# By default, this file will be empty except for this notice.

# Disabled 2026-08-31: this mixin's WorldGenRegion chunk-access
# optimization throws NullPointerException("No chunk exists at [x, z]")
# when a jigsaw structure's block-processing rule reaches into a
# neighboring chunk during placement - crashed world generation with
# the new structure mods' larger structures (When Dungeons Arise,
# Structory: Towers). Confirmed exact key from the mod's own bundled
# assets/lithium/lithium-mixin-config-default.properties, not guessed.
mixin.gen.chunk_region=false

# Disabled same day, same root cause: a second, related mixin in this
# same family also crashes on the same "structure piece reaches a
# chunk outside its generation region" situation, just via a different
# code path (RuntimeException "We are asking a region for a chunk out
# of bound", through WorldGenRegion.getChunk -> LevelReader.hasChunk,
# intercepted by lithium.mixins.json's util.chunk_access.WorldViewMixin
# specifically - confirmed which config key covers that exact mixin
# from the same real mixins.json listing, not guessed).
mixin.util.chunk_access=false
