#If true, Nights of the Undead (horde nights) are enabled | default: true
# **Re-enabled 2026-09-04 - the 2026-09-02 fix above was wrong about the
# real scope of this flag, found via a real live bug: "wave 9, nothing
# spawned in at all," every endless-phase wave since instantly and
# vacuously "clearing" with zero real mobs.** Decompiling
# HordeSpawner.tick() directly (not just SpawnHordeCommand, which is all
# the 2026-09-02 fix checked) shows this flag is the VERY FIRST check in
# tick() - `if (!MainConfig.getUndeadNightsEnabled()) return 0` - before
# the code that actually processes entitiesWithPendingHorde (the queue
# /undeadnights spawn_horde adds to) ever runs. So the command really
# did queue a pending horde every time, exactly as the old comment
# said - but nothing ever consumed that queue, because the one method
# that does was bailing out at its own first line. The whole endless
# phase (wave 9+) has been completely non-functional since that fix
# shipped, not because of anything from today's own changes.
# Re-enabling this restores that pipeline. The ORIGINAL problem (this
# pack's own night-locking during waves tripping the autonomous
# horde-night system) is now blocked at its own source instead:
# chanceForHordeNight and enableRandomHordes are zeroed across all 40
# levels in undeadnights_difficulty_config.json, and
# hordeZombiesSpawnNaturally below is now false - all 3 real autonomous
# trigger paths inside HordeSpawner.tick() closed off directly, leaving
# only the explicit spawn_horde command (this pack's own deterministic
# trigger) able to actually queue anything.
undeadNightsEnabled = true
#Grace period in days before the first horde night | default: 0
gracePeriod = 0
#If true, each night a message will be sent to the player with how many nights are left before the next Horde Night | default: false
sendHordeNightsCountdownMessage = false
#If true, the horde has spawned message and the horde sound are enabled | default: true
hordeSpawnedMessageAndSound = true
#Minimum distance a horde will spawn away from the player | default: 70
#Range: 10 ~ 256
#Reverted to the mod's own default 2026-09-01, real bug found on the
#first actual endless-phase playtest: "horde spawned" but nothing
#appeared. Root cause confirmed, not guessed - the live instance's real
#simulationDistance is 12 chunks (192 blocks; options.txt), and the
#previous 240 value was chosen to spawn "beyond the worldborder" (same
#border-relative thinking wave_spawner.js's own spawn code had, since
#fixed - see docs/FEATURES.md's "World type"/"Wave Horn" sections)
#without accounting for simulation distance at all. Every horde spawn
#target landed in a chunk beyond what the game actually simulates, so
#the mobs never ticked or became visible. The mod's own default (70)
#is comfortably inside 192 blocks with real margin.
distanceMin = 70
#Maximum distance a horde will spawn away from the player | default: 75
#Range: 10 ~ 256
distanceMax = 75
#Maximum amount of horde mobs that can be loaded in the world at the same time | default: 80
hordeMobsSpawnCap = 80
#If true, the vanilla gamerule doMobSpawning will be ignored | default: true
ignoreDoMobSpawningGamerule = true
#If true, horde waves can spawn in water | default: false
hordeWavesCanSpawnInWater = false
#If true, horde waves can spawn on trees | default: false
hordeWavesCanSpawnOnTrees = false
#If true, horde waves can spawn in caves [EXPERIMENTAL]| default: false
hordeWavesCanSpawnInCaves = false
#Distance a horde will spawn away from the player when in a cave | default: 50
caveSpawnDistance = 50
#If true, the light level of the block position can prevent horde mobs from spawning | default: false
blockLightLevelsInfluenceMonsterSpawns = false
#Maximum block light level so a monster can spawn | default: 0
maxBlockLightLevelForMonsterSpawns = 0
#If true, Players can't sleep through horde nights | default: true
hordeNightsDisableSleeping = true
#If true, the difficulty level will automatically progress over time | default: false
#Driven manually via /undeadnights difficulty set <n> from wave_spawner.js instead - real day count has no relationship to wave number in this pack.
enableAutomaticDifficultyProgression = false
#If true, horde mobs will not despawn when closer than the max tracking range | default: false
preventDespawnWhenInsideMaxTrackingRange = false
#If true, Horde Zombies are not able to break reinforced blocks from the Security Craft mod | default: false
#Required: the starter base's Chokepoint walls are SecurityCraft reinforced blocks.
securityCraftCompatibility = true
#If true, Horde Zombies will spawn naturally | default: true
# Set false 2026-09-04, alongside re-enabling undeadNightsEnabled above -
# this gates a real THIRD autonomous spawn path inside HordeSpawner.tick()
# (a per-player, per-tick 3% chance "stray zombie" spawn, independent of
# horde nights/random hordes entirely) that would otherwise still fire
# once the master flag came back on.
hordeZombiesSpawnNaturally = false
#If true, Elite Zombies will spawn naturally | default: true
eliteZombiesSpawnNaturally = true
#If true, Demolition Zombies will spawn naturally | default: true
demolitionZombiesSpawnNaturally = true
#If true, Horde, Elite and Demolition zombies will not spawn naturally before the first horde night | default: true
noNaturalSpawningBeforeFirstHordeNight = true
#Horde zombie max health | default: 40.0
maxHealthHordeZombies = 40.0
#Elite zombie max health | default: 40.0
maxHealthEliteZombies = 40.0
#Demolition zombie max health | default: 40.0
maxHealthDemolitionZombies = 40.0
#If true, debug messages will be logged out | default: false
printDebugMessages = false
#If true, horde mobs are added with the glow effect (for debugging) | default: false
debugMakeHordeMobsGlow = false
